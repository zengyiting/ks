<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>基于协同过滤的商品推荐系统 - 管理后台</title>
  <link rel="stylesheet" href="/admin/app.css"/>
</head>
<body>
<main class="page">
  <header class="topbar">
    <div>
      <h1 class="title">基于协同过滤的商品推荐系统</h1>
      <p class="subtitle">输入用户ID、算法和 Top-N，实时查看推荐结果</p>
    </div>
    <nav class="nav">
      <a href="/admin/behavior.html">行为采集</a>
      <a href="/admin/users.html">用户管理</a>
      <a href="/admin/items.html">商品管理</a>
      <button id="logoutBtn" class="ghost" type="button">退出登录</button>
      <button id="themeToggle" class="ghost" type="button">切换暗色</button>
    </nav>
  </header>

  <section class="card">
    <h3>推荐参数</h3>
    <div class="toolbar">
      <label for="uid">用户ID</label>
      <input id="uid" type="number" value="1" min="1"/>
      <label for="topn">Top-N</label>
      <input id="topn" type="number" value="10" min="1" max="100"/>
      <label for="algo">算法</label>
      <select id="algo">
        <option value="user">User-Based</option>
        <option value="item">Item-Based</option>
        <option value="behavior">Behavior-Based</option>
        <option value="hybrid">Hybrid</option>
      </select>
      <button id="btn">获取推荐</button>
      <span id="msg" class="status"></span>
    </div>
  </section>

  <section class="card">
    <h3>推荐结果</h3>
    <table id="result">
      <thead>
      <tr><th>商品ID</th><th>名称</th><th>类别</th><th>推荐分数</th><th>推荐理由</th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <div class="pager">
      <div class="pager-info" id="pagerInfo">暂无数据</div>
      <div class="pager-controls">
        <div class="actions compact">
          <label for="pageSize">每页</label>
          <select id="pageSize">
            <option value="5">5</option>
            <option value="8" selected>8</option>
            <option value="10">10</option>
            <option value="20">20</option>
          </select>
        </div>
        <button id="prevPage" class="ghost" type="button">上一页</button>
        <div class="page-numbers" id="pageNumbers"></div>
        <button id="nextPage" class="ghost" type="button">下一页</button>
      </div>
    </div>
  </section>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  let pageSize = 8;
  let rows = [];
  let page = 1;
  function initTheme() {
    const key = 'theme';
    const saved = localStorage.getItem(key) || 'light';
    document.documentElement.setAttribute('data-theme', saved);
    $('themeToggle').textContent = saved === 'dark' ? '切换亮色' : '切换暗色';
    $('themeToggle').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem(key, next);
      $('themeToggle').textContent = next === 'dark' ? '切换亮色' : '切换暗色';
    });
  }
  function setMsg(text, cls) {
    const m = $('msg');
    m.textContent = text || '';
    m.className = 'status ' + (cls || '');
  }
  function render() {
    const tbody = document.querySelector('#result tbody');
    tbody.innerHTML = '';
    const totalPages = Math.max(1, Math.ceil(rows.length / pageSize));
    page = Math.max(1, Math.min(page, totalPages));
    const start = (page - 1) * pageSize;
    const pageRows = rows.slice(start, start + pageSize);
    pageRows.forEach(row => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${row.itemId}</td><td>${row.name||''}</td><td>${row.category||''}</td><td>${row.score.toFixed(4)}</td><td>${row.reason||''}</td>`;
      tbody.appendChild(tr);
    });
    $('pagerInfo').textContent = rows.length === 0 ? '暂无数据' : `第 ${page}/${totalPages} 页，共 ${rows.length} 条`;
    $('prevPage').disabled = page <= 1;
    $('nextPage').disabled = page >= totalPages;
    renderPageNumbers(totalPages);
  }
  function renderPageNumbers(totalPages) {
    const wrap = $('pageNumbers');
    wrap.innerHTML = '';
    if (rows.length === 0) return;
    let start = Math.max(1, page - 2);
    let end = Math.min(totalPages, start + 4);
    start = Math.max(1, end - 4);
    for (let i = start; i <= end; i++) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = i === page ? 'active' : 'ghost';
      btn.textContent = i;
      btn.addEventListener('click', () => {
        page = i;
        render();
      });
      wrap.appendChild(btn);
    }
  }
  $('btn').addEventListener('click', async () => {
    const uid = $('uid').value || 1;
    const n = $('topn').value || 5;
    const algo = $('algo').value;
    const url = `/api/recommendations/${uid}?n=${n}&algo=${algo}`;
    setMsg('加载中...', '');
    try {
      const resp = await fetch(url);
      if (!resp.ok) {
        const err = await resp.json();
        setMsg(err.message || '请求失败', 'err');
        return;
      }
      rows = await resp.json();
      page = 1;
      render();
      setMsg(`已返回 ${rows.length} 条推荐`, 'ok');
    } catch (e) {
      setMsg('请求失败：' + e, 'err');
    }
  });
  $('prevPage').addEventListener('click', () => {
    page--;
    render();
  });
  $('nextPage').addEventListener('click', () => {
    page++;
    render();
  });
  $('pageSize').addEventListener('change', (e) => {
    pageSize = Number(e.target.value) || 8;
    page = 1;
    render();
  });

  $('logoutBtn').addEventListener('click', async () => {
    try { await fetch('/api/admin/logout'); } catch (e) {}
    window.location.href = '/admin/login.html';
  });

  initTheme();

  // Check login
  (async () => {
    try {
      const resp = await fetch('/api/admin/status');
      const data = await resp.json();
      if (!data.authenticated) {
        window.location.href = '/admin/login.html';
        return;
      }
      render();
    } catch (e) {
      window.location.href = '/admin/login.html';
    }
  })();
</script>
</body>
</html>
