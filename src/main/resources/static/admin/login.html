<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>管理后台登录 - 基于协同过滤的商品推荐系统</title>
  <link rel="stylesheet" href="/admin/app.css"/>
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg, #edf2fa);
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 40px;
      border-radius: 16px;
      background: var(--card-bg, #fff);
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    }
    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-header h1 {
      font-size: 24px;
      margin: 0 0 8px;
      color: var(--text, #1a1a2e);
    }
    .login-header p {
      color: var(--text-secondary, #666);
      font-size: 14px;
      margin: 0;
    }
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .login-form label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text, #1a1a2e);
    }
    .login-form input {
      padding: 12px 16px;
      border: 1px solid var(--border, #e0e0e0);
      border-radius: 8px;
      font-size: 14px;
      background: var(--input-bg, #f5f5f5);
      transition: border-color 0.2s;
    }
    .login-form input:focus {
      outline: none;
      border-color: var(--accent, #4f7cff);
      background: #fff;
    }
    .login-btn {
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: var(--accent, #4f7cff);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .login-btn:hover {
      opacity: 0.9;
    }
    .login-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .login-msg {
      text-align: center;
      font-size: 13px;
      padding: 10px;
      border-radius: 8px;
    }
    .login-msg.err {
      background: rgba(239,68,68,0.1);
      color: #ef4444;
    }
    .login-msg.ok {
      background: rgba(34,197,94,0.1);
      color: #22c55e;
    }
  </style>
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <h1>管理后台登录</h1>
      <p>基于协同过滤的商品推荐系统</p>
    </div>
    <form class="login-form" id="loginForm">
      <label>
        用户名
        <input type="text" id="username" placeholder="请输入用户名" autocomplete="username" required/>
      </label>
      <label>
        密码
        <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" required/>
      </label>
      <button type="submit" class="login-btn" id="loginBtn">登 录</button>
      <div class="login-msg" id="msg"></div>
    </form>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);

  function setMsg(text, cls) {
    $('msg').textContent = text;
    $('msg').className = 'login-msg ' + (cls || '');
  }

  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = $('username').value.trim();
    const password = $('password').value;

    if (!username || !password) {
      setMsg('请输入用户名和密码', 'err');
      return;
    }

    $('loginBtn').disabled = true;
    $('loginBtn').textContent = '登录中...';
    setMsg('', '');

    try {
      const resp = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const data = await resp.json();

      if (data.success) {
        setMsg('登录成功，正在跳转...', 'ok');
        setTimeout(() => {
          window.location.href = '/admin/index.html';
        }, 800);
      } else {
        setMsg(data.message || '登录失败', 'err');
        $('loginBtn').disabled = false;
        $('loginBtn').textContent = '登 录';
      }
    } catch (err) {
      setMsg('网络错误，请重试', 'err');
      $('loginBtn').disabled = false;
      $('loginBtn').textContent = '登 录';
    }
  });

  // Check if already logged in
  (async () => {
    try {
      const resp = await fetch('/api/admin/status');
      const data = await resp.json();
      if (data.authenticated) {
        window.location.href = '/admin/index.html';
      }
    } catch (e) {
      // Ignore
    }
  })();
</script>
</body>
</html>
